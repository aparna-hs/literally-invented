name: Supabase Ping

on:
  schedule:
      - cron: '0 0 */5 * *'
        workflow_dispatch:

        jobs:
          ping-leaderboard:
              runs-on: ubuntu-latest
                  steps:
                        - name: Checkout code
                                uses: actions/checkout@v4

                                      - name: Setup Node.js
                                              uses: actions/setup-node@v4
                                                      with:
                                                                node-version: '18'

                                                                      - name: Install Playwright
                                                                              run: npm install playwright

                                                                                    - name: Run Playwright automation
                                                                                            run: |
                                                                                                      cat > ping-leaderboard.js << 'EOF'
                                                                                                                const { chromium } = require('playwright');
                                                                                                                
                                                                                                                          (async () => {
                                                                                                                                      try {
                                                                                                                                                    const browser = await chromium.launch();
                                                                                                                                                                  const page = await browser.newPage();
                                                                                                                                                                  
                                                                                                                                                                                console.log('Navigating to Literally Invented...');
                                                                                                                                                                                              await page.goto('https://literally-invented.vercel.app/', {
                                                                                                                                                                                                              waitUntil: 'networkidle',
                                                                                                                                                                                                                              timeout: 30000
                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                          console.log('Page loaded, waiting for leaderboard button...');
                                                                                                                                                                                                                                                                        await page.waitForTimeout(2000);
                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                      console.log('Clicking leaderboard button...');
                                                                                                                                                                                                                                                                                                    const leaderboardButton = await page.locator('button:has-text("LEADERBOARD")');
                                                                                                                                                                                                                                                                                                                  await leaderboardButton.click();
                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                console.log('Leaderboard clicked, waiting for data to load...');
                                                                                                                                                                                                                                                                                                                                              await page.waitForTimeout(3000);
                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                            console.log('Leaderboard loaded successfully!');
                                                                                                                                                                                                                                                                                                                                                                          await browser.close();
                                                                                                                                                                                                                                                                                                                                                                                        console.log('Supabase ping completed!');
                                                                                                                                                                                                                                                                                                                                                                                                    } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                  console.error('Error:', error);
                                                                                                                                                                                                                                                                                                                                                                                                                                process.exit(1);
                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                      })();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                EOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          node ping-leaderboard.js
