name: Ping Supabase
on:
  schedule:
    - cron: "0 0 */5 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install playwright
      - run: npx playwright install chromium
      - run: |
          cat > ping.js << 'SCRIPT'
          const { chromium } = require('playwright');
          (async () => {
            try {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              await page.goto('https://literally-invented.vercel.app/', { waitUntil: 'networkidle' });
              await page.waitForTimeout(2000);
              const btn = await page.locator('button:has-text("LEADERBOARD")');
              await btn.click();
              await page.waitForTimeout(3000);
              await browser.close();
              console.log('Ping completed');
            } catch (e) {
              console.error(e);
              process.exit(1);
            }
          })();
          SCRIPT
          node ping.js
